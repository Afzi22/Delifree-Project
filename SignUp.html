<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/Login_SignUp.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body class="Signup">
    <div class="signup-page">
      <div class="base-signup">
        <div class="container-base-signup">
            <div class="logo-container">
              <img src="image/Logo_2.png" class="logo" />
            </div>
        </div>
        <div class="overlay-signup">
          <div class="default-signup">
              <div class="close-2">
                <i class="fa-solid fa-xmark close"></i>
              </div>
              <h1 class="judul">Create Account</h1>
              <!-- <div class="login-container">
                <button class="gmail">
                  <i class="fa-brands fa-google gm"></i>
                  <a class="gml">Sign Up With Google</a>
                </button>
              </div>
              <i class="information-3"> OR </i> -->
              <div class="inputContainer-signup">
                <div class="icon-box">
                  <i class="fa-regular fa-envelope email"></i>
                  <input
                  type="email"
                  placeholder="Email"
                  class="textbox"
                  name="email"
                  />
                </div>
              </div>
              <div class="inputContainer-signup">
                <div class="icon-box">
                  <i class="fa-regular fa-user username"></i>
                  <input
                  type="username"
                  placeholder="Username"
                  class="textbox"
                  name="username"
                  />
                </div>
              </div>
              <div class="inputContainer-signup2">
                <div class="icon-box">
                  <i class="fa-solid fa-lock password"></i>
                  <input
                  type="password"
                  placeholder="Password"
                  class="textbox"
                  name="password"
                  />
                </div>
                <button class="eye">
                  <i class="fa-regular fa-eye show"></i>
                </button>
              </div>
            </div>
            <div class="button-signup-2">
              <form action="Login.html">
                <button class="btnSignup">Sign Up</button>
              </form>
            </div>
            <div class="login-box">
              <p class="information">Already have an account?</p>
              <a href="Login.html" class="information-2">Login</a>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
