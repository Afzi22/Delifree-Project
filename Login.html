<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/Login_SignUp.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body class="Login">
    <div class="login-page">
      <div class="base-login">
        <div class="container-base-login">
          <div class="close-1">
            <i class="fa-solid fa-xmark close"></i>
          </div>
            <div class="logo-container">
              <img src="image/Logo_2.png" class="logo">
            </div>
        </div>
        <div class="overlay-login">
          <div class="default-login">
            <h1 class="judul">Login To Delifree</h1>
            <!-- <div class="signup-container">
              <button class="gmail">
                <i class="fa-brands fa-google gm"></i>
                <a class="gml">Sign Up With Google</a>
              </button>
            </div>
            <i class="information-3"> OR </i> -->
              <div class="inputContainer-login">
                <div class="icon-box">
                  <i class="fa-regular fa-envelope email"></i>
                  <input type="login" placeholder="Email or Username" class="textbox" name="login" required/>
                </div>
              </div>
              <div class="inputContainer-login2">
                <div class="icon-box">
                  <i class="fa-solid fa-lock password"></i>
                  <input type="password" placeholder="Password" class="textbox" name="password" required/>
                </div>
                <button class="eye">
                  <i class="fa-regular fa-eye show"></i>
                </button>
              </div>
            </div>
            <div class="button-login-2">
              <form action="Dashboard.html">
                <button class="btnLogin">Login</button>
              </form>
            </div>
            <div class="signup-box">
              <p class="information">Don't have an account yet?</p>
              <a href="SignUp.html" class="information-2">SignUp</a>
            </div>
            
        </div>
      </div>
    </div>
  </body>
</html>
